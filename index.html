<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARS EUROPA TV - Palinsesto</title>

<!-- ===================== PWA META ===================== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0e15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARS TV">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<!-- ===================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script data-goatcounter="https://arseuropatv.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0c0e15;
    --ink-2: #12141f;
    --card: #1c2030;
    --card-hover: #262b3f;
    --gold: #c9a227;
    --gold-bright: #e8c565;
    --gold-soft: rgba(201,162,39,0.35);
    --paper: #ece6d8;
    --muted: #7c7f95;
    --red: #b0392b;
    --border: rgba(236,230,216,0.08);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---- INSTALL BANNER ---- */
  #installBanner {
    display: none;
    align-items: center;
    gap: 0.8rem;
    padding: 0.7rem 1.5rem;
    background: var(--ink-2);
    border-bottom: 1px solid var(--border);
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    color: var(--gold);
  }
  #installBanner.visible { display: flex; }
  #installBanner span { flex: 1; color: var(--paper); font-family: 'Fraunces', serif; font-size: 0.9rem; letter-spacing: 0.02em; }
  #btnInstall {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    padding: 0.4rem 0.9rem;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.2s, color 0.2s;
  }
  #btnInstall:hover { background: var(--gold); color: var(--ink); }

  /* ---- iOS INSTALL HINT ---- */
  #iosBanner {
    display: none;
    flex-direction: column;
    gap: 0.4rem;
    padding: 0.8rem 1.5rem;
    background: var(--ink-2);
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  #iosBanner.visible { display: flex; }
  #iosBanner p { margin: 0; color: var(--paper); font-family: 'Fraunces', serif; font-size: 0.9rem; letter-spacing: 0.02em; line-height: 1.5; }
  #iosBanner p strong { color: var(--gold); font-weight: 600; }
  #btnIosDismiss {
    align-self: flex-end;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
    padding: 0 0.2rem;
    position: absolute;
    right: 1.2rem;
  }

  #btnDismiss { background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; line-height: 1; padding: 0 0.2rem; }
  #btnDismiss:hover { color: var(--paper); }

  #btnFullscreen {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    background: rgba(0,0,0,0.65);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 22px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #btnFullscreen:hover { background: rgba(0,0,0,0.95); }

  /* ---------- HEADER ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem 2.5rem;
    background: var(--ink-2);
    border-bottom: 1px solid var(--border);
  }

  .logo-img { height: 32px; width: auto; display: block; }

  .header-right { display: flex; align-items: center; gap: 1.6rem; }

  .on-air-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    color: var(--red);
    text-transform: uppercase;
  }

  .on-air-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }

  .clock { font-family: 'Space Mono', monospace; font-size: 0.85rem; color: var(--muted); letter-spacing: 0.06em; }

  /* ---------- PLAYER ---------- */
  .watch-section { padding: 2.2rem 2.5rem 1rem; max-width: 1200px; margin: 0 auto; }

  .now-playing-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 0.8rem;
  }

  .player-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border: 1px solid var(--border); }
  #player, .player-wrapper iframe { width: 100%; height: 100%; }

  .player-meta { padding-top: 1.3rem; max-width: 780px; }

  .hero-title {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.4rem, 2.6vw, 2rem);
    line-height: 1.15;
    color: var(--paper);
    margin-bottom: 0.7rem;
  }

  .hero-meta { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; margin-bottom: 1.3rem; }
  .hero-time { font-family: 'Space Mono', monospace; font-size: 0.78rem; color: var(--gold); letter-spacing: 0.08em; }
  .hero-tag { font-family: 'Space Mono', monospace; font-size: 0.68rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid var(--border); padding: 0.25rem 0.6rem; }

  .hero-actions { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; margin-bottom: 1rem; }

  .btn-primary {
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    background: var(--gold);
    color: var(--ink);
    border: none;
    padding: 0.75rem 1.4rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--gold-bright); }

  .btn-secondary {
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    background: transparent;
    color: var(--paper);
    border: 1px solid var(--border);
    padding: 0.75rem 1.4rem;
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-secondary:hover { border-color: var(--gold); color: var(--gold-bright); }

  .countdown-pill { display: none; align-items: baseline; gap: 0.5rem; font-family: 'Inter', sans-serif; font-size: 0.82rem; color: var(--muted); }
  .countdown-pill strong { color: var(--paper); font-weight: 500; }
  .countdown-pill .timer { color: var(--gold); font-family: 'Space Mono', monospace; }

  /* ---------- ROWS ---------- */
  main { position: relative; z-index: 2; padding: 2.4rem 0 4rem; }
  .row { margin-bottom: 2.6rem; }

  .row-header { display: flex; align-items: baseline; justify-content: space-between; padding: 0 2.5rem; margin-bottom: 0.9rem; }
  .row-title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.15rem; color: var(--paper); letter-spacing: 0.01em; }
  .row-count { font-family: 'Space Mono', monospace; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }

  .row-track { display: flex; gap: 0.9rem; overflow-x: auto; padding: 0.3rem 2.5rem 1rem; scroll-snap-type: x proximity; scrollbar-width: none; }
  .row-track::-webkit-scrollbar { display: none; }

  .card {
    position: relative;
    flex: 0 0 auto;
    width: 258px;
    aspect-ratio: 16/9;
    background: var(--card);
    border: 1px solid var(--border);
    scroll-snap-align: start;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.22s ease, border-color 0.22s ease;
  }

  .card:hover { transform: translateY(-4px) scale(1.035); border-color: var(--gold-soft); z-index: 3; }

  .card-thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--card); }

  .card.past .card-thumb { opacity: 0.35; }
  .card.active { border-color: var(--gold); }

  .card-live {
    position: absolute; top: 0.5rem; left: 0.5rem; z-index: 2;
    background: var(--red); color: #fff;
    font-family: 'Space Mono', monospace; font-size: 0.55rem; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 0.2rem 0.45rem;
  }

  .card-info {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 0.7rem 0.8rem 0.65rem;
    background: linear-gradient(to top, rgba(10,11,17,0.92), rgba(10,11,17,0));
  }
  .card-title { font-family: 'Inter', sans-serif; font-size: 0.76rem; font-weight: 500; color: var(--paper); line-height: 1.25; margin-bottom: 0.3rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-time { font-family: 'Space Mono', monospace; font-size: 0.6rem; color: var(--gold); letter-spacing: 0.08em; }

  .no-program { padding: 3rem 2.5rem; text-align: center; color: var(--muted); font-family: 'Fraunces', serif; font-style: italic; font-size: 1.1rem; line-height: 1.8; }

  /* ---------- SCHEDA DETTAGLIO ---------- */
  .detail-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(6,7,11,0.8);
    align-items: center; justify-content: center;
    padding: 1.5rem;
  }
  .detail-overlay.visible { display: flex; }

  .detail-panel {
    position: relative;
    width: 100%; max-width: 560px;
    background: var(--card);
    border: 1px solid var(--border);
    max-height: 88vh;
    overflow-y: auto;
  }

  .detail-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #000; }

  .detail-close {
    position: absolute; top: 0.6rem; right: 0.6rem; z-index: 2;
    background: rgba(6,7,11,0.7); color: var(--paper);
    border: none; width: 30px; height: 30px; border-radius: 50%;
    font-size: 1.1rem; line-height: 1; cursor: pointer;
  }
  .detail-close:hover { background: rgba(6,7,11,0.95); }

  .detail-body { padding: 1.4rem 1.6rem 1.6rem; }

  .detail-title {
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 500;
    font-size: 1.3rem; line-height: 1.25; color: var(--paper);
    margin-bottom: 0.8rem;
  }

  .detail-meta { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }

  .detail-desc { font-family: 'Inter', sans-serif; font-size: 0.9rem; line-height: 1.6; color: var(--muted); margin-bottom: 1.3rem; }
  .detail-desc.placeholder { font-style: italic; }

  footer { padding: 2rem 2.5rem 3rem; text-align: center; font-family: 'Fraunces', serif; font-style: italic; font-size: 0.85rem; color: var(--muted); }

  @media (max-width: 720px) {
    header { padding: 1rem 1.2rem; }
    .watch-section, .row-header, .row-track { padding-left: 1.2rem; padding-right: 1.2rem; }
    .card { width: 210px; }
  }
</style>
</head>
<body>

<!-- ---- INSTALL BANNER (Chrome/Android) ---- -->
<div id="installBanner" role="banner" aria-label="Installazione app">
  <span>Aggiungi ARS EUROPA TV alla schermata Home</span>
  <button id="btnInstall">Installa</button>
  <button id="btnDismiss" aria-label="Chiudi">&times;</button>
</div>

<!-- ---- iOS INSTALL HINT ---- -->
<div id="iosBanner" role="banner" aria-label="Istruzioni installazione iOS">
  <button id="btnIosDismiss" aria-label="Chiudi">&times;</button>
  <p>Per aggiungere <strong>ARS EUROPA TV</strong> alla schermata Home:</p>
  <p>Tocca <strong>&#x2BAD; Condividi</strong> in basso, poi <strong>&#x2295; Aggiungi alla schermata Home</strong>.</p>
</div>

<button id="btnFullscreen" onclick="toggleFullscreen()" title="Schermo intero">&#x26F6;</button>

<header>
  <div class="logo"><img src="logo.png" alt="ARS EUROPA TV" class="logo-img"></div>
  <div class="header-right">
    <div class="on-air-badge"><div class="on-air-dot"></div>In onda</div>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</header>

<section class="watch-section">
  <div class="now-playing-label">In onda ora</div>
  <div class="player-wrapper"><div id="player"></div></div>
  <div class="player-meta">
    <h1 class="hero-title" id="heroTitle">Caricamento...</h1>
    <div class="hero-meta">
      <div class="hero-time" id="heroTime"></div>
      <div class="hero-tag" id="heroTag"></div>
    </div>
    <div class="hero-actions">
      <button class="btn-primary" onclick="document.getElementById('rows').scrollIntoView()">Palinsesto completo</button>
      <a class="btn-secondary" href="https://www.arseuropa.org/2026/07/15/come-vedere-ars-europa-tv-sulla-tua-smart-tv/" target="_blank" rel="noopener">Guarda su smart TV</a>
      <div class="countdown-pill" id="countdownSection">
        A seguire <strong id="countdownTitle"></strong> <span class="timer" id="countdownTimer"></span>
      </div>
    </div>
  </div>
</section>

<main id="rows"></main>

<footer>La programmazione scorre automaticamente secondo il palinsesto.</footer>

<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this) closeDetail()">
  <div class="detail-panel">
    <button class="detail-close" onclick="closeDetail()" aria-label="Chiudi">&times;</button>
    <img class="detail-thumb" id="detailThumb" src="" alt="">
    <div class="detail-body">
      <div class="hero-title detail-title" id="detailTitle"></div>
      <div class="hero-meta detail-meta">
        <div class="hero-time" id="detailTime"></div>
        <div class="hero-tag" id="detailTag"></div>
      </div>
      <div class="detail-desc" id="detailDesc"></div>
    </div>
  </div>
</div>

<script src="palinsesto.js"></script>
<script>
  /* ===================================================
     PALINSESTO
  =================================================== */
  const today = new Date().getDay();
  const schedule = schedules[today] || schedules[1];

  function parseTime(t) {
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
  }

  function getNowMinutes() {
    const now = new Date();
    return now.getHours() * 60 + now.getMinutes();
  }

  function getCurrentItem() {
    const nowMin = getNowMinutes();
    let current = null, next = null;
    for (let i = 0; i < schedule.length; i++) {
      const itemMin = parseTime(schedule[i].time);
      const nextMin = i + 1 < schedule.length ? parseTime(schedule[i + 1].time) : 24 * 60;
      if (nowMin >= itemMin && nowMin < nextMin) {
        current = { ...schedule[i], index: i };
        if (i + 1 < schedule.length)
          next = { ...schedule[i + 1], index: i + 1, startMin: parseTime(schedule[i + 1].time) };
        break;
      }
    }
    return { current, next };
  }

  /* ===================================================
     SPOT ARS EUROPA
  =================================================== */
  const spots = ['RT-QooEEajc','m2An4KJPkEY','ZrucffDKt2k','JdimSrYFqSE','xzRkzb23pYM','cKBtL2OqRIk'];
  const SPOT_MAX = 2;

  let player, loadedIndex = -1, playingSpot = false;
  let spotsPlayed = 0, spotsTarget = 1, nextProgramIndex = -1, usedSpots = [];

  function randomSpotId() {
    if (usedSpots.length >= spots.length) usedSpots = [];
    const available = spots.filter(s => !usedSpots.includes(s));
    const picked = available[Math.floor(Math.random() * available.length)];
    usedSpots.push(picked);
    return picked;
  }

  function showSpotBadge() {
    document.getElementById('heroTitle').textContent = 'Messaggio ARS EUROPA';
    document.getElementById('heroTime').textContent = '';
    document.getElementById('heroTag').textContent = 'Intermezzo';
  }

  function loadNextProgram() {
    playingSpot = false; spotsPlayed = 0;
    const idx = nextProgramIndex;
    if (idx >= 0 && idx < schedule.length) {
      loadedIndex = idx;
      player.loadVideoById({ videoId: schedule[idx].id });
      document.getElementById('heroTitle').textContent = schedule[idx].title;
      document.getElementById('heroTime').textContent = schedule[idx].time;
      document.getElementById('heroTag').textContent = schedule[idx].tag || '';
      renderRows(idx);
    }
  }

  function toggleFullscreen() {
    const btn = document.getElementById('btnFullscreen');
    if (!document.fullscreenElement) {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      btn.textContent = '\u2715';
      btn.title = 'Esci da schermo intero';
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      btn.textContent = '\u26F6';
      btn.title = 'Schermo intero';
    }
  }

  function playNextSpot() { showSpotBadge(); player.loadVideoById({ videoId: randomSpotId() }); }

  function startSpotBreak(nextIdx) {
    playingSpot = true; spotsPlayed = 0;
    spotsTarget = Math.floor(Math.random() * SPOT_MAX) + 1;
    nextProgramIndex = nextIdx;
    playNextSpot();
  }

  window.onYouTubeIframeAPIReady = function () {
    const { current } = getCurrentItem();
    if (!current) {
      document.getElementById('heroTitle').textContent = 'Nessun programma in questo momento.';
      document.querySelector('.hero-meta').style.display = 'none';
      document.querySelector('.hero-actions').style.display = 'none';
      renderRows(-1);
      return;
    }

    loadedIndex = current.index;
    player = new YT.Player('player', {
      videoId: current.id,
      playerVars: { autoplay: 1, controls: 1, modestbranding: 1, rel: 0, playsinline: 1 },
      events: {
        onReady: function (e) {
          const now = new Date();
          const currentMin = parseTime(current.time);
          const elapsedSeconds = (getNowMinutes() - currentMin) * 60 + now.getSeconds();
          if (elapsedSeconds > 0) e.target.seekTo(elapsedSeconds, true);
          e.target.playVideo();
        },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.ENDED) {
            if (playingSpot) {
              spotsPlayed++;
              if (spotsPlayed >= spotsTarget) loadNextProgram();
              else playNextSpot();
            } else {
              const nextIndex = loadedIndex + 1;
              if (nextIndex < schedule.length) startSpotBreak(nextIndex);
              else {
                player.loadVideoById({ videoId: 'KqRAVCJqehE' });
                document.getElementById('heroTitle').textContent = 'Fine trasmissioni';
                document.getElementById('heroTime').textContent = '';
                document.getElementById('heroTag').textContent = '';
              }
            }
          }
        }
      }
    });

    updateMeta();
    renderRows(current.index);
  };

  function updateMeta() {
    const { current, next } = getCurrentItem();
    if (!current) return;
    document.getElementById('heroTitle').textContent = current.title;
    document.getElementById('heroTime').textContent = current.time;
    document.getElementById('heroTag').textContent = current.tag || '';
    if (next) {
      const diffMin = next.startMin - getNowMinutes();
      const h = Math.floor(diffMin / 60), m = diffMin % 60;
      const countdown = h > 0 ? h + 'h ' + m + 'min' : m + ' min';
      document.getElementById('countdownSection').style.display = 'flex';
      document.getElementById('countdownTitle').textContent = next.title;
      document.getElementById('countdownTimer').textContent = 'tra ' + countdown;
    } else {
      document.getElementById('countdownSection').style.display = 'none';
    }
  }

  /* ===================================================
     RIGHE PER SEZIONE TEMATICA (copertine reali YouTube)
  =================================================== */
  function groupByTag(list) {
    const map = new Map();
    list.forEach((item, idx) => {
      const key = item.tag || 'Palinsesto';
      if (!map.has(key)) map.set(key, []);
      map.get(key).push({ ...item, idx });
    });
    return map;
  }

  function scrollRowToTarget(trackEl, cardEl) {
    if (!cardEl) return;
    const paddingLeft = parseFloat(getComputedStyle(trackEl).paddingLeft) || 0;
    const trackRect = trackEl.getBoundingClientRect();
    const cardRect = cardEl.getBoundingClientRect();
    const offset = (cardRect.left - trackRect.left) + trackEl.scrollLeft - paddingLeft;
    trackEl.scrollLeft = Math.max(0, offset);
  }

  function renderRows(activeIdx) {
    const main = document.getElementById('rows');
    main.innerHTML = '';
    if (!schedule.length) {
      main.innerHTML = '<div class="no-program">Nessun programma disponibile per oggi.</div>';
      return;
    }
    const nowMin = getNowMinutes();
    const grouped = groupByTag(schedule);

    grouped.forEach((items, tag) => {
      let targetIdx = 0;
      let foundUpcoming = false;

      const cardsHtml = items.map((item, i) => {
        const nextMin = item.idx + 1 < schedule.length ? parseTime(schedule[item.idx + 1].time) : 24 * 60;
        const isPast = nowMin >= nextMin;
        const isActive = item.idx === activeIdx;
        if (!isPast && !foundUpcoming) { targetIdx = i; foundUpcoming = true; }
        const thumb = 'https://img.youtube.com/vi/' + item.id + '/hqdefault.jpg';
        return `
          <div class="card${isActive ? ' active' : ''}${isPast && !isActive ? ' past' : ''}" onclick="openDetail(${item.idx})">
            <img class="card-thumb" src="${thumb}" alt="" loading="lazy">
            ${isActive ? '<div class="card-live">&#9654; in onda</div>' : ''}
            <div class="card-info">
              <div class="card-title">${item.title}</div>
              <div class="card-time">${item.time}</div>
            </div>
          </div>`;
      }).join('');

      if (!foundUpcoming) targetIdx = items.length - 1;

      const section = document.createElement('div');
      section.className = 'row';
      section.innerHTML = `
        <div class="row-header">
          <div class="row-title">${tag}</div>
          <div class="row-count">${items.length} appuntamenti</div>
        </div>
        <div class="row-track">${cardsHtml}</div>`;
      main.appendChild(section);

      const trackEl = section.querySelector('.row-track');
      const cardEls = trackEl.querySelectorAll('.card');
      scrollRowToTarget(trackEl, cardEls[targetIdx]);
    });
  }

  /* ===================================================
     SCHEDA DI DETTAGLIO
  =================================================== */
  function openDetail(idx) {
    const item = schedule[idx];
    if (!item) return;
    document.getElementById('detailThumb').src = 'https://img.youtube.com/vi/' + item.id + '/hqdefault.jpg';
    document.getElementById('detailTitle').textContent = item.title;
    document.getElementById('detailTime').textContent = item.time;
    document.getElementById('detailTag').textContent = item.tag || '';

    const descEl = document.getElementById('detailDesc');
    if (item.description) {
      descEl.textContent = item.description;
      descEl.style.display = 'block';
    } else {
      descEl.textContent = '';
      descEl.style.display = 'none';
    }

    document.getElementById('detailOverlay').classList.add('visible');
  }

  function closeDetail() {
    document.getElementById('detailOverlay').classList.remove('visible');
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDetail();
  });

  function updateClock() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('it-IT');
  }

  updateClock();
  setInterval(updateClock, 1000);
  setInterval(updateMeta, 30000);

  /* =====================================================
     PWA: Service Worker + Install Prompt
  ===================================================== */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('[SW] Registrato:', reg.scope))
        .catch(err => console.warn('[SW] Errore:', err));
    });
  }

  window.addEventListener('load', function () {
    const params = new URLSearchParams(window.location.search);
    if (params.get('tv') === '1') {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
  });

  let deferredPrompt = null;
  const installBanner = document.getElementById('installBanner');
  const btnInstall = document.getElementById('btnInstall');
  const btnDismiss = document.getElementById('btnDismiss');

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    installBanner.classList.add('visible');
  });

  btnInstall.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBanner.classList.remove('visible');
  });

  btnDismiss.addEventListener('click', () => installBanner.classList.remove('visible'));

  window.addEventListener('appinstalled', () => {
    installBanner.classList.remove('visible');
    deferredPrompt = null;
  });

  const iosBanner = document.getElementById('iosBanner');
  const btnIosDismiss = document.getElementById('btnIosDismiss');
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isInStandaloneMode = window.navigator.standalone === true;
  const iosHintDismissed = sessionStorage.getItem('iosHintDismissed');
  if (isIos && !isInStandaloneMode && !iosHintDismissed) {
    iosBanner.classList.add('visible');
  }
  btnIosDismiss.addEventListener('click', () => {
    iosBanner.classList.remove('visible');
    sessionStorage.setItem('iosHintDismissed', '1');
  });
</script>

<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
